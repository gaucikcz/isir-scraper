name: ISIR soupisy majetkove podstaty

# Jen rucni spousteni (z webu i z mobilni appky) - neni to nic, co by muselo
# bezet kazdy den. Doplni k ulozenym vecem odkaz na nejnovejsi soupis.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Kolik veci nejvyse zpracovat (200 = vychozi, 0 = vsechny)"
        required: false
        default: "200"
      all:
        description: "Obnovit i veci, ktere uz soupis maji (mohl pribyt novejsi)"
        required: false
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

# Workflow commituje SQLite databazi a docs/data.json zpet do repozitare.
permissions:
  contents: write

# Nesmi commitovat do stejne vetve zaroven s dennim sberem.
concurrency:
  group: isir-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soupisy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Systemove zavislosti (pdftotext + cesky OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ces

      - name: Python zavislosti
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dohledani soupisu
        shell: bash
        # ZADNE ANTHROPIC_API_KEY / ANTHROPIC_WORKSPACE_ID zamerne nejsou:
        # beh je ciste HTTP (jen HTML detailu veci), nestahuje PDF a nevola
        # LLM, takze zadne credentials nepotrebuje.
        env:
          LIMIT: ${{ inputs.limit || '200' }}
          ALL: ${{ inputs.all || 'false' }}
        run: |
          ARGS=""
          if [ -n "${LIMIT}" ]; then
            ARGS="--limit ${LIMIT}"
          fi
          if [ "${ALL}" = "true" ]; then
            ARGS="${ARGS} --all"
          fi
          python cli.py refresh-soupis ${ARGS} 2>&1 | tee run.log

      # always(): kdyz beh spadne uprostred, v SQLite uz jsou dohledane soupisy
      # commitnute po jednom - musime je ulozit do repa, at prace neprijde vnivec.
      - name: Export docs/data.json
        if: always()
        shell: bash
        run: |
          python cli.py export 2>&1 | tee -a run.log

      - name: Commit vysledku
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data
          if [ -f docs/data.json ]; then
            git add docs/data.json
          fi
          # Commit jen kdyz se neco opravdu zmenilo.
          git diff --staged --quiet || git commit -m "ISIR: soupisy majetkove podstaty $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || (git pull --rebase --autostash && git push)

      - name: Souhrn do GitHub Actions (viditelny v mobilni appce)
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os

          from isir import db

          conn = db.connect()
          db.init_schema(conn)
          coverage = db.soupis_coverage(conn)
          conn.close()

          celkem = coverage["cases"]
          se_soupisem = coverage["se_soupisem"]
          procenta = (100.0 * se_soupisem / celkem) if celkem else 0.0

          lines = [
              "## ISIR soupisy majetkove podstaty",
              "",
              "- Veci s odkazem na soupis: **{}** z **{}** ({:.0f} %)".format(
                  se_soupisem, celkem, procenta),
              "- Bez soupisu: **{}**".format(celkem - se_soupisem),
          ]

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Log pri selhani
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isir-soupis-log
          path: |
            run.log
            *.log
            data/*.log
          if-no-files-found: ignore
          retention-days: 14
