<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>ISIR — příležitosti mimo dražbu</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f7f6f3;
  --panel:#ffffff;
  --panel-2:#fbfaf8;
  --ink:#16181b;
  --muted:#5c6169;
  --faint:#8a9099;
  --rule:#e5e2dc;
  --rule-strong:#d3cec6;
  --accent:#9c3a16;
  --accent-tint:rgba(156,58,22,.08);
  --mid:#1f5d7a;
  --mid-tint:rgba(31,93,122,.08);
  --low:#6e737b;
  --low-tint:rgba(110,115,123,.09);
  --new-ink:#1b6b4a;
  --new-tint:rgba(27,107,74,.10);
  --warn-ink:#7a5411;
  --warn-tint:#fdf3d8;
  --warn-rule:#e8d093;
  --shadow:0 1px 2px rgba(20,22,26,.05), 0 6px 18px rgba(20,22,26,.045);
  --shadow-lift:0 1px 2px rgba(20,22,26,.06), 0 10px 30px rgba(20,22,26,.07);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --serif:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e0f11;
    --panel:#16181b;
    --panel-2:#1b1e22;
    --ink:#f0eee9;
    --muted:#a2a8b0;
    --faint:#767c85;
    --rule:#26292e;
    --rule-strong:#363b42;
    --accent:#e8875a;
    --accent-tint:rgba(232,135,90,.12);
    --mid:#78b8d6;
    --mid-tint:rgba(120,184,214,.12);
    --low:#98a0a9;
    --low-tint:rgba(152,160,169,.12);
    --new-ink:#5cc79c;
    --new-tint:rgba(92,199,156,.13);
    --warn-ink:#e9c879;
    --warn-tint:#2a2109;
    --warn-rule:#57451a;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
    --shadow-lift:0 1px 2px rgba(0,0,0,.55), 0 12px 32px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:56px;
  /* viewport-fit=cover pousti obsah pod notch a home indicator - v rezimu
     "Pridat na plochu" (SETUP.md, bod 6) se stranka kresli pres cely displej. */
  padding-bottom:calc(56px + env(safe-area-inset-bottom));
}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 18px;
  padding-left:calc(18px + env(safe-area-inset-left));
  padding-right:calc(18px + env(safe-area-inset-right));
}
@media (min-width:720px){.wrap{padding:0 32px;
  padding-left:calc(32px + env(safe-area-inset-left));
  padding-right:calc(32px + env(safe-area-inset-right));
}}

/* ---------- masthead ---------- */
.masthead{border-bottom:1px solid var(--rule);padding:26px 0 20px;margin-bottom:22px;
  padding-top:calc(26px + env(safe-area-inset-top));
}
.kicker{
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  display:flex;align-items:center;gap:9px;margin-bottom:12px;
}
.kicker::before{content:"";width:16px;height:2px;background:var(--accent);flex:0 0 auto}
h1{
  font-family:var(--serif);
  font-weight:600;
  font-size:clamp(25px,6.6vw,38px);
  line-height:1.1;
  letter-spacing:-.015em;
  margin:0 0 10px;
}
.meta{margin:0;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .sep{color:var(--rule-strong);padding:0 7px}

/* ---------- banner ---------- */
.banner{
  background:var(--warn-tint);color:var(--warn-ink);
  border:1px solid var(--warn-rule);border-radius:9px;
  padding:11px 14px;font-size:13px;margin-bottom:22px;
  display:flex;gap:9px;align-items:baseline;
}
.banner b{font-weight:650;letter-spacing:.01em}

/* ---------- stats ---------- */
.stats{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:26px;
}
@media (min-width:760px){.stats{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}}
.stat{
  appearance:none;-webkit-appearance:none;
  background:var(--panel);border:1px solid var(--rule);border-radius:9px;
  padding:11px 12px 10px;min-height:66px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  transition:border-color .12s ease, background .12s ease;
}
.stat[disabled]{cursor:default;background:transparent;border-style:dashed;opacity:.85}
.stat .n{font-size:23px;font-weight:640;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat[data-k="vysoka"] .n{color:var(--accent)}
.stat[data-k="stredni"] .n{color:var(--mid)}
.stat[data-k="new"] .n{color:var(--new-ink)}
.stat.on{border-color:currentColor}
.stat.on[data-k="vse"]{background:var(--low-tint);border-color:var(--rule-strong)}
.stat.on[data-k="vysoka"]{background:var(--accent-tint);border-color:var(--accent)}
.stat.on[data-k="stredni"]{background:var(--mid-tint);border-color:var(--mid)}
.stat.on[data-k="nizka"]{background:var(--low-tint);border-color:var(--rule-strong)}
.stat.on[data-k="new"]{background:var(--new-tint);border-color:var(--new-ink)}

/* ---------- controls ---------- */
.controls{margin-bottom:30px;display:flex;flex-direction:column;gap:12px}
.search{position:relative}
.search input{
  width:100%;min-height:46px;padding:12px 40px 12px 14px;
  background:var(--panel);color:var(--ink);
  border:1px solid var(--rule);border-radius:9px;
  font-family:inherit;font-size:16px;
}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--rule-strong);box-shadow:0 0 0 3px var(--low-tint)}
.search .clear{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border:0;background:transparent;color:var(--faint);
  font-size:19px;line-height:1;cursor:pointer;border-radius:8px;
}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  appearance:none;-webkit-appearance:none;
  min-height:38px;padding:8px 14px;border-radius:999px;cursor:pointer;
  background:var(--panel);border:1px solid var(--rule);color:var(--muted);
  font-size:13px;letter-spacing:.01em;
  transition:border-color .12s ease, color .12s ease, background .12s ease;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:560}
.chip.chip-alt[aria-pressed="true"]{background:var(--new-tint);border-color:var(--new-ink);color:var(--new-ink)}
.chip.chip-quiet[aria-pressed="true"]{background:var(--low-tint);border-color:var(--rule-strong);color:var(--ink)}

/* ---------- sections ---------- */
.section{margin-bottom:38px}
.section-head{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.section-head h2{
  font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.01em;margin:0;
}
.section-head .count{
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.section-head .line{flex:1 1 auto;height:1px;background:var(--rule)}
.section-note{font-size:12.5px;color:var(--faint);margin:-8px 0 16px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
}

/* ---------- card ---------- */
.card{
  background:var(--panel-2);
  border:1px solid var(--rule);
  border-radius:11px;
  padding:16px;
  overflow-wrap:anywhere;
  display:flex;flex-direction:column;gap:12px;
}
.card--primary{
  background:var(--panel);
  padding:19px 18px;
  border-left:3px solid var(--accent);
  box-shadow:var(--shadow-lift);
}
.card--primary .admin{background:var(--panel-2)}
.card[data-status="videno"]{opacity:.72}
.card[data-status="kontaktovano"]{border-color:var(--new-ink)}
.card[data-status="archiv"]{opacity:.5}
.card-top{display:flex;flex-direction:column;gap:7px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.card h3{
  margin:0;font-family:var(--serif);font-weight:600;letter-spacing:-.012em;line-height:1.22;
  font-size:18px;
}
.card--primary h3{font-size:21px}
.ref{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ref .sep{color:var(--rule-strong);padding:0 6px}
.factline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.factline .date{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:560}
.summary{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.card--primary .summary{font-size:14.5px;color:var(--ink)}

/* pills & badges */
.pill{
  display:inline-block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;border:1px solid var(--rule);
  color:var(--muted);background:var(--panel-2);white-space:nowrap;font-weight:560;
}
.pill--new{color:var(--new-ink);background:var(--new-tint);border-color:transparent}
.pill--warn{color:var(--warn-ink);background:var(--warn-tint);border-color:var(--warn-rule)}
.pill--prio{border-color:transparent}
.pill--prio[data-p="vysoka"]{color:var(--accent);background:var(--accent-tint)}
.pill--prio[data-p="stredni"]{color:var(--mid);background:var(--mid-tint)}
.pill--prio[data-p="nizka"]{color:var(--low);background:var(--low-tint)}

/* assets */
.assets{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.asset{
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;
  padding:11px 0;border-bottom:1px solid var(--rule);align-items:start;
}
.asset:last-child{border-bottom:0;padding-bottom:2px}
.asset .typ{
  font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;
  padding:3px 7px;border-radius:4px;margin-top:1px;white-space:nowrap;
}
.asset .typ[data-t="nemovity"]{color:var(--accent);background:var(--accent-tint)}
.asset .typ[data-t="movity"]{color:var(--mid);background:var(--mid-tint)}
.asset .typ[data-t="nehmotny"]{color:var(--low);background:var(--low-tint)}
.asset .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.asset .desc{font-size:13.5px;line-height:1.45}
.asset .price{
  font-variant-numeric:tabular-nums;font-size:14px;font-weight:620;letter-spacing:-.01em;
}
.asset .price.none{font-weight:500;font-size:12.5px;color:var(--faint);font-style:italic}
.asset .buyer{font-size:12px;color:var(--faint)}
.asset .buyer b{font-weight:560;color:var(--muted)}

/* administrator */
.admin{
  background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:11px 12px;
  display:flex;flex-direction:column;gap:4px;
}
.admin .lbl{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.admin .nm{font-size:13.5px;font-weight:600}
.admin .rows{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:2px}
.admin a{font-size:13px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule-strong);padding:2px 0;min-height:24px;display:inline-block}
.admin .ds{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}

/* dokumenty ve spisu */
.docs{
  background:var(--panel);border:1px solid var(--rule);border-radius:8px;
}
.docs>summary{
  list-style:none;cursor:pointer;
  display:flex;align-items:center;gap:9px;
  min-height:44px;padding:10px 12px;
  font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted);
}
.docs>summary::-webkit-details-marker{display:none}
.docs>summary::after{
  content:"";margin-left:auto;flex:0 0 auto;
  width:7px;height:7px;margin-bottom:3px;
  border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);
  transform:rotate(45deg);transition:transform .12s ease;
}
.docs[open]>summary::after{transform:rotate(225deg);margin-bottom:-2px}
.docs>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.docs-body{padding:0 12px 8px;display:flex;flex-direction:column;gap:10px}
.docgroup{border-top:1px solid var(--rule);padding-top:8px}
.docgroup-h{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
}
.docgroup--warn{
  border:1px solid var(--warn-rule);background:var(--warn-tint);border-radius:8px;
  padding:9px 10px 4px;
}
.docgroup--warn .docgroup-h{color:var(--warn-ink)}
.docgroup-i{font-size:11px;line-height:1}
.docnote{margin:5px 0 1px;font-size:12px;line-height:1.45;color:var(--warn-ink)}
.doclist{list-style:none;margin:0;padding:0}
.doclist a{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 9px;
  min-height:44px;padding:9px 0;
  color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.4;
  border-bottom:1px solid var(--rule);
}
.doclist li:last-child a{border-bottom:0}
.docgroup--warn .doclist a{border-bottom-color:var(--warn-rule)}
.doclist .dt{flex:0 0 auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.docgroup--warn .doclist .dt{color:var(--warn-ink)}
.doclist .dp{min-width:0;text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:3px}

/* buttons */
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;padding:10px 15px;border-radius:8px;
  border:1px solid var(--rule-strong);background:var(--panel);
  font-size:13.5px;font-weight:550;text-decoration:none;color:var(--ink);
  flex:1 1 auto;text-align:center;
}
.btn--primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn--soupis,
.btn--dossier{background:var(--accent-tint);border-color:var(--accent);color:var(--accent);font-weight:620}
/* jedine .btn, ktere je <button> - bez resetu appearance ho iOS Safari
   vykresli nativne (jiny radius, jine pozadi) a nesedel by k odkazum vedle */
.btn--copy{appearance:none;-webkit-appearance:none;cursor:pointer;white-space:nowrap}
.btn--copy.is-ok{background:var(--new-tint);border-color:var(--new-ink);color:var(--new-ink)}
.btn--copy.is-err{background:var(--warn-tint);border-color:var(--warn-rule);color:var(--warn-ink)}
@media (min-width:520px){.btn{flex:0 0 auto}}

/* dossier */
.dossier{display:flex;flex-direction:column;gap:7px}
.dossier-hint{margin:0;font-size:12px;line-height:1.45;color:var(--faint)}

/* status segmented control */
.status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;border-top:1px solid var(--rule);padding-top:12px}
@media (min-width:420px){.status{grid-template-columns:repeat(4,minmax(0,1fr))}}
.status button{
  appearance:none;-webkit-appearance:none;
  min-height:44px;padding:6px 4px;border-radius:7px;cursor:pointer;
  border:1px solid var(--rule);background:var(--panel-2);color:var(--muted);
  font-size:11.5px;letter-spacing:.02em;
}
.status button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.status button[data-s="kontaktovano"][aria-pressed="true"]{background:var(--new-ink);border-color:var(--new-ink);color:var(--bg)}

/* notices */
.notice{
  border:1px dashed var(--rule-strong);border-radius:11px;background:var(--panel-2);
  padding:34px 22px;text-align:center;margin:12px 0 34px;
}
.notice h2{font-family:var(--serif);font-weight:600;font-size:18px;margin:0 0 8px}
.notice p{margin:0;font-size:13.5px;color:var(--muted)}
.notice .det{margin-top:10px;font-size:12px;color:var(--faint);word-break:break-word}

footer{border-top:1px solid var(--rule);margin-top:10px;padding:20px 0 0}
footer p{margin:0;font-size:11.5px;color:var(--faint);line-height:1.6}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="kicker">Insolvenční rejstřík · událost I_347</div>
    <h1>ISIR — příležitosti mimo dražbu</h1>
    <p class="meta" id="meta">načítám…</p>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="banner" hidden></div>

  <section class="stats" id="stats" aria-label="Přehled"></section>

  <section class="controls" aria-label="Filtry">
    <div class="search">
      <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="Hledat dlužníka, spisovou značku, majetek…" aria-label="Hledat">
      <button class="clear" id="q-clear" type="button" aria-label="Vymazat hledání" hidden>&times;</button>
    </div>
    <div class="chips" id="chips-prio" role="group" aria-label="Priorita">
      <button class="chip" type="button" data-p="vse" aria-pressed="true">Vše</button>
      <button class="chip" type="button" data-p="vysoka" aria-pressed="false">Nemovitosti</button>
      <button class="chip" type="button" data-p="stredni" aria-pressed="false">Movité</button>
      <button class="chip" type="button" data-p="nizka" aria-pressed="false">Nehmotné</button>
    </div>
    <div class="chips">
      <button class="chip chip-alt" type="button" id="t-new" aria-pressed="false">Jen nové</button>
      <button class="chip chip-quiet" type="button" id="t-arch" aria-pressed="false">Zobrazit archiv</button>
    </div>
  </section>

  <div id="state"></div>

  <section class="section" id="sec-primary" hidden>
    <div class="section-head">
      <h2>Doporučené příležitosti</h2>
      <span class="line"></span>
      <span class="count" id="count-primary"></span>
    </div>
    <p class="section-note">Nemovitý majetek — pozemky, budovy, byty, haly, areály.</p>
    <div class="grid" id="grid-primary"></div>
  </section>

  <section class="section" id="sec-secondary" hidden>
    <div class="section-head">
      <h2>Ostatní nálezy</h2>
      <span class="line"></span>
      <span class="count" id="count-secondary"></span>
    </div>
    <div class="grid" id="grid-secondary"></div>
  </section>

  <div id="filter-empty" hidden></div>

  <footer>
    <p id="foot"></p>
  </footer>
</main>

<script>
(function(){
  "use strict";

  var LS_STATUS = "isir.status.v1";
  var LS_FILTER = "isir.filters.v1";
  var STATUSES = ["novy","videno","kontaktovano","archiv"];
  var STATUS_LABEL = {novy:"nový", videno:"viděno", kontaktovano:"kontaktováno", archiv:"archiv"};
  var PRIO_LABEL = {vysoka:"vysoká", stredni:"střední", nizka:"nízká"};
  var TYP_LABEL = {nemovity:"nemovitost", movity:"movitá věc", nehmotny:"nehmotné"};
  var PRIO_ORDER = {vysoka:0, stredni:1, nizka:2};
  var ASSET_HEAD = {nemovity:"Nemovitost", movity:"Movitá věc", nehmotny:"Nehmotný majetek"};
  var COPY_LABEL = "Kopírovat pro AI";

  /* poradi skupin v disclosure "Dokumenty ve spisu"; posledni je zachytna
     skupina pro kategorie, ktere scraper zatim nezna */
  var DOC_GROUPS = [
    {k:"soupis",  h:"Soupis majetkové podstaty"},
    {k:"katastr", h:"Výpis z katastru"},
    {k:"zprava",  h:"Zprávy správce"},
    {k:"prodej",  h:"Dřívější prodeje", warn:true},
    {k:"navrh",   h:"Návrhy"},
    {k:"ostatni", h:"Ostatní dokumenty"}
  ];
  var PRODEJ_NOTE = "Soud už v této věci schválil prodej — ověř, zda se netýká i majetku, který tě zajímá.";
  var DOSSIER_REPO = "https://github.com/gaucikcz/isir-scraper";

  /* ---------- storage (always guarded) ---------- */
  function lsGet(key, fallback){
    try{
      var raw = window.localStorage.getItem(key);
      if(!raw) return fallback;
      var val = JSON.parse(raw);
      return (val && typeof val === "object") ? val : fallback;
    }catch(e){ return fallback; }
  }
  function lsSet(key, val){

  /* ---------- helpers ---------- */
  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text !== undefined && text !== null && text !== "") n.textContent = String(text);
    return n;
  }
  function txt(v){ return (v === undefined || v === null) ? "" : String(v); }
  function nonEmpty(v){ return typeof v === "string" && v.trim() !== ""; }

  function safeHref(u){
    if(!nonEmpty(u)) return null;
    try{
      var a = document.createElement("a");
      a.href = u.trim();
      var p = (a.protocol || "").toLowerCase();
      if(p === "https:" || p === "http:") return a.href;
      return null;
    }catch(e){ return null; }
  }

  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function parseDay(s){
    if(!nonEmpty(s)) return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s.trim());
    if(!m) return null;
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }
  function fmtDay(s){
    var d = parseDay(s);
    if(!d) return null;
    return d.getDate() + ". " + (d.getMonth() + 1) + ". " + d.getFullYear();
  }
  function fmtStamp(s){
    if(!nonEmpty(s)) return null;
    var d = new Date(s);
    if(isNaN(d.getTime())) return null;
    return d.getDate() + ". " + (d.getMonth() + 1) + ". " + d.getFullYear() + " v " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function daysAgo(s){
    var d = parseDay(s);
    if(!d) return null;
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((today.getTime() - d.getTime()) / 86400000);
  }
  function isNew(o){
    var n = daysAgo(o && o.first_seen);
    return n !== null && n >= 0 && n <= 7;
  }
  function fmtAmount(s){
    if(!nonEmpty(s)) return null;
    var out = String(s).trim();
    out = out.replace(/\d{4,}/g, function(run){
      return run.replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0");
    });
    out = out.replace(/\bCZK\b/g, "Kč");
    out = out.replace(/\bvc\. DPH\b/g, "vč. DPH");
    return out;
  }
  function deaccent(s){
    var v = String(s).toLowerCase();
    try{ v = v.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }catch(e){}
    return v;
  }

  /* ---------- soupis majetkove podstaty ---------- */
  function soupisOf(o){
    var s = (o && typeof o.soupis === "object" && o.soupis) ? o.soupis : null;
    if(!s) return null;
    var href = safeHref(s.url);
    if(!href) return null;
    return {url: href, datum: fmtDay(s.datum), popis: oneLine(s.popis)};
  }
  function soupisNote(s){
    if(s.datum) return s.datum;
    if(!s.popis) return null;
    var p = s.popis.replace(/^soupis(?:u)? majetkov[\u00e9e] podstaty/i, "").replace(/^[\s\u2013\u2014:,-]+/, "").trim();
    return p !== "" ? p : null;
  }
  function soupisBtn(o){

    if(!s) return null;

  /* ---------- dokumenty ve spisu ---------- */
  /* Znormalizuje o.dokumenty na polozky s bezpecnou absolutni URL. Polozka bez
     pouzitelneho odkazu je k nicemu (kliknout nejde), takze ji zahazujeme -
     a N v nadpisu tak vzdy odpovida poctu skutecne vypsanych radku. */
  function docsOf(o){
    var list = (o && Array.isArray(o.dokumenty)) ? o.dokumenty : [];
    var seen = {}, out = [];
    for(var i = 0; i < list.length; i++){
      var d = list[i];
      if(!d || typeof d !== "object") continue;
      var href = safeHref(d.url);
      if(!href) continue;
      if(Object.prototype.hasOwnProperty.call(seen, href)) continue;
      seen[href] = true;
      var kat = txt(d.kategorie).trim().toLowerCase();
      var known = false;
      for(var g = 0; g < DOC_GROUPS.length; g++){
        if(DOC_GROUPS[g].k === kat){ known = true; break; }
      }
      if(!known) kat = "ostatni";
      out.push({
        url: href,
        kategorie: kat,
        datumRaw: nonEmpty(d.datum) ? d.datum.trim() : null,
        datum: fmtDay(d.datum),
        popis: oneLine(d.popis) || oneLine(d.kod) || "dokument"
      });
    }
    return out;
  }
  function docsSortDesc(a, b){
    var da = parseDay(a.datumRaw), db = parseDay(b.datumRaw);
    if(da && db) return db.getTime() - da.getTime();
    if(da) return -1;
    if(db) return 1;
    return 0;
  }
  function groupDocs(docs){
    var groups = [];
    for(var g = 0; g < DOC_GROUPS.length; g++){
      var def = DOC_GROUPS[g], items = [];
      for(var i = 0; i < docs.length; i++){
        if(docs[i].kategorie === def.k) items.push(docs[i]);
      }
      if(!items.length) continue;
      items.sort(docsSortDesc);
      groups.push({def: def, items: items});
    }
    return groups;
  }
  /* Je mezi dokumenty uz schvaleny prodej? Cely seznam sedi ve slozenem
     <details>, takze samotna vystrazna skupina uvnitr NENI na karte videt -
     musi se ohlasit odznakem nahore, jinak uzivatel telefonuje spravci kvuli
     prilezitosti, ktera je davno pryc. */
  function hasProdej(docs){
    for(var i = 0; i < docs.length; i++){
      if(docs[i].kategorie === "prodej") return true;
    }
    return false;
  }
  function buildDocs(docs){
    if(!docs.length) return null;
    var det = el("details", "docs");
    det.appendChild(el("summary", null, "Dokumenty ve spisu (" + docs.length + ")"));
    var body = el("div", "docs-body");
    var groups = groupDocs(docs);
    for(var g = 0; g < groups.length; g++){
      var def = groups[g].def, items = groups[g].items;
      var box = el("div", "docgroup" + (def.warn ? " docgroup--warn" : ""));
      box.setAttribute("data-c", def.k);
      var head = el("div", "docgroup-h");
      if(def.warn) head.appendChild(el("span", "docgroup-i", "⚠"));
      head.appendChild(el("span", null, def.h));
      if(def.warn) head.appendChild(el("span", "pill pill--warn", "pozor"));
      box.appendChild(head);
      if(def.warn) box.appendChild(el("p", "docnote", PRODEJ_NOTE));
      var ul = el("ul", "doclist");
      for(var i = 0; i < items.length; i++){
        var it = items[i];
        var a = el("a");
        a.href = it.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        if(it.datum) a.appendChild(el("span", "dt", it.datum));
        a.appendChild(el("span", "dp", it.popis));
        var li = el("li");
        li.appendChild(a);
        ul.appendChild(li);
      }
      box.appendChild(ul);
      body.appendChild(box);
    }
    det.appendChild(body);
    return det;
  }

  /* ---------- dossier ---------- */
  /* Staticka stranka nesmi obsahovat token, takze Action nespoustime primo -
     otevreme predvyplnene GitHub issue se stitkem "dossier", ktere uzivatel
     jednim klepnutim odesle. */
  function dossierIssueUrl(o){
    var znacka = oneLine(o.spisova_znacka);
    var name = oneLine(o.dluznik_jmeno);
    var title = "Dossier: " + (znacka || name || oneLine(o.doc_id) || "neznámá věc");
    var ico = oneLine(o.ico);
    var lines = [];
    lines.push("Dlužník: " + (name || "neuveden") + (ico ? (", IČO " + ico) : ""));
    if(znacka) lines.push("Spisová značka: " + znacka);
    var soud = oneLine(o.soud);
    if(soud) lines.push("Soud: " + soud);
    var detail = safeHref(o.detail_url);
    if(detail) lines.push("Detail v ISIR: " + detail);
    var doc = safeHref(o.doc_url);
    if(doc) lines.push("Návrh na zpeněžení (PDF): " + doc);
    lines.push("");
    lines.push("Prosím sesbírej dokumenty z tohoto spisu do jednoho dossieru.");
    /* ZADNY parametr "labels": GitHub na ?labels=<stitek, ktery v repu
       neexistuje> vraci 404 a tlacitko by nefungovalo. Autorizaci resi
       workflow podle autora issue (viz .github/workflows/dossier.yml). */
    return DOSSIER_REPO + "/issues/new" +
           "?title=" + encodeURIComponent(title) +
           "&body=" + encodeURIComponent(lines.join("\n"));
  }
  function buildDossier(o){
    var row = el("div", "btns");
    var open = linkBtn(o.dossier_url, "Otevřít dossier", false);
    if(open){
      open.className = "btn btn--dossier";
      row.appendChild(open);
    }
    var gen = linkBtn(dossierIssueUrl(o), open ? "Vygenerovat znovu" : "Vygenerovat dossier", false);
    if(gen) row.appendChild(gen);
    if(!row.childNodes.length) return null;
    var wrap = el("div", "dossier");
    wrap.appendChild(row);
    wrap.appendChild(el("p", "dossier-hint", open
      ? "Dossier je hotový; nový si vyžádáš přes GitHub issue — trvá to pár minut a odkaz přijde do komentáře."
      : "Dossier posbírá dokumenty z tohoto spisu do jednoho textového souboru — trvá to pár minut a GitHub pak do issue připíše odkaz."));
    return wrap;
  }

  /* ---------- brief pro AI (schranka) ---------- */
  function oneLine(v){
    if(!nonEmpty(v)) return null;
    var s = v.replace(/\s+/g, " ").trim();
    return s === "" ? null : s;
  }
  function escHtml(v){
    return txt(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function briefAmount(v){
    var a = fmtAmount(v);
    return a ? a.replace(/\u00a0/g, " ") : null;
  }
  function briefClassified(v){
    if(v === "heuristic" || v === "heuristika") return "heuristika";
    if(v === "llm" || v === "LLM") return "llm";
    return oneLine(v);
  }

  function buildBrief(o){
    var md = [], html = [];
    function facts(rows){
      var li = [];
      for(var i = 0; i < rows.length; i++){
        md.push("- **" + rows[i][0] + ":** " + rows[i][1]);
        li.push("<li><strong>" + escHtml(rows[i][0]) + ":</strong> " + escHtml(rows[i][1]) + "</li>");
      }
      if(li.length) html.push("<ul>" + li.join("") + "</ul>");
    }

    var name = oneLine(o.dluznik_jmeno) || "neuveden";
    md.push("# Insolvenční příležitost — " + name);
    md.push("");
    html.push("<h1>Insolvenční příležitost — " + escHtml(name) + "</h1>");

    var head = [];
    var znacka = oneLine(o.spisova_znacka), soud = oneLine(o.soud);
    if(znacka) head.push(["Spisová značka", soud ? (znacka + " (" + soud + ")") : znacka]);
    else if(soud) head.push(["Soud", soud]);
    var ico = oneLine(o.ico);
    head.push(["Dlužník", ico ? (name + ", IČO " + ico) : name]);
    var sidlo = oneLine(o.sidlo);
    if(sidlo) head.push(["Sídlo", sidlo]);
    var stav = oneLine(o.stav_rizeni);
    if(stav) head.push(["Stav řízení", stav]);
    var podani = fmtDay(o.datum_podani);
    if(podani) head.push(["Datum podání návrhu", podani]);
    head.push(["Priorita", PRIO_LABEL[priorityOf(o)]]);
    facts(head);

    var shrnuti = oneLine(o.shrnuti);
    if(shrnuti){
      md.push("", "## Shrnutí", shrnuti);
      html.push("<h2>Shrnutí</h2>", "<p>" + escHtml(shrnuti) + "</p>");
    }

    var list = Array.isArray(o.assets) ? o.assets : [];
    var items = [];
    for(var i = 0; i < list.length; i++){
      var a = list[i] || {};
      if(!nonEmpty(a.popis) && !nonEmpty(a.navrhovana_cena) && !nonEmpty(a.kupujici)) continue;
      items.push(a);
    }
    if(items.length){
      md.push("", "## Nabízený majetek");
      html.push("<h2>Nabízený majetek</h2>");
      for(var j = 0; j < items.length; j++){
        var it = items[j];
        var t = (it.typ === "nemovity" || it.typ === "movity" || it.typ === "nehmotny") ? it.typ : null;
        var heading = (j + 1) + ". " + (t ? ASSET_HEAD[t] : "Majetek");
        md.push("", "### " + heading);
        html.push("<h3>" + escHtml(heading) + "</h3>");
        var rows = [];
        var popis = oneLine(it.popis);
        if(popis) rows.push(["Popis", popis]);
        rows.push(["Navrhovaná cena", briefAmount(it.navrhovana_cena) || "neuvedena"]);
        rows.push(["Kupující", oneLine(it.kupujici) || "neuveden"]);
        facts(rows);
      }
    }

    var s = (o && typeof o.spravce === "object" && o.spravce) ? o.spravce : {};
    var sprRows = [];
    if(nonEmpty(s.jmeno)) sprRows.push(["Jméno", oneLine(s.jmeno)]);
    if(nonEmpty(s.email)) sprRows.push(["E-mail", oneLine(s.email)]);
    if(nonEmpty(s.telefon)) sprRows.push(["Telefon", oneLine(s.telefon)]);
    if(nonEmpty(s.datova_schranka)) sprRows.push(["Datová schránka", oneLine(s.datova_schranka)]);
    if(sprRows.length){
      md.push("", "## Insolvenční správce");
      html.push("<h2>Insolvenční správce</h2>");
      facts(sprRows);
    }

    /* Model, ktery dostane odkazy na listiny ve spisu, je nesrovnatelne
       uzitecnejsi nez model, ktery ma jen shrnuti. */
    var bdocs = docsOf(o);
    if(bdocs.length){
      md.push("", "## Dokumenty ve spisu");
      html.push("<h2>Dokumenty ve spisu</h2>");
      var bgroups = groupDocs(bdocs);
      for(var bg = 0; bg < bgroups.length; bg++){
        var bdef = bgroups[bg].def, bitems = bgroups[bg].items;
        md.push("", "### " + bdef.h);
        html.push("<h3>" + escHtml(bdef.h) + "</h3>");
        if(bdef.warn){
          md.push("", PRODEJ_NOTE, "");
          html.push("<p>" + escHtml(PRODEJ_NOTE) + "</p>");
        }
        var bli = [];
        for(var bd = 0; bd < bitems.length; bd++){
          var bit = bitems[bd];
          var blead = (bit.datum ? (bit.datum + " — ") : "") + bit.popis;
          md.push("- " + blead + ": " + bit.url);
          bli.push("<li>" + escHtml(blead) + ": <a href=\"" + escHtml(bit.url) + "\">" +
                   escHtml(bit.url) + "</a></li>");
        }
        html.push("<ul>" + bli.join("") + "</ul>");
      }
    }

    var srcRows = [];
    var docUrl = safeHref(o.doc_url);
    if(docUrl) srcRows.push(["Návrh na zpeněžení (PDF)", docUrl]);
    var soupis = soupisOf(o);
    if(soupis){
      var sNote = soupisNote(soupis);
      srcRows.push(["Soupis majetkové podstaty" + (sNote ? (" (" + sNote + ")") : ""), soupis.url]);
    }
    var detailUrl = safeHref(o.detail_url);
    if(detailUrl) srcRows.push(["Detail věci v ISIR", detailUrl]);
    var orUrl = safeHref(o.or_url);
    if(orUrl) srcRows.push(["Obchodní rejstřík", orUrl]);
    if(srcRows.length){
      md.push("", "## Zdroje");
      html.push("<h2>Zdroje</h2>");
      var srcLi = [];
      for(var k = 0; k < srcRows.length; k++){
        md.push("- " + srcRows[k][0] + ": " + srcRows[k][1]);
        srcLi.push("<li>" + escHtml(srcRows[k][0]) + ": <a href=\"" + escHtml(srcRows[k][1]) + "\">" +
                   escHtml(srcRows[k][1]) + "</a></li>");
      }
      html.push("<ul>" + srcLi.join("") + "</ul>");
    }

    var foot = [];
    var cls = briefClassified(o.classified_by);
    if(cls) foot.push("Klasifikace: automatická (" + cls + ") — ověř proti zdrojovému PDF.");
    var stamp = fmtStamp(DATA && DATA.generated_at) || oneLine(DATA && DATA.generated_at);
    foot.push("Zdroj dat: insolvenční rejstřík ISIR" + (stamp ? (", staženo " + stamp) : "") + ".");
    md.push("", "---");
    html.push("<hr>");
    for(var f = 0; f < foot.length; f++){
      md.push(foot[f]);
      html.push("<p>" + escHtml(foot[f]) + "</p>");
    }

    var task = "**Úkol:** Odhadni tržní cenu tohoto majetku v ČR a uveď, jaké údaje ti k ocenění chybí.";
    md.push("", "---", "", task, "");
    html.push("<hr>", "<p><strong>Úkol:</strong> Odhadni tržní cenu tohoto majetku v ČR a uveď, " +
              "jaké údaje ti k ocenění chybí.</p>");

    return {md: md.join("\n"), html: "<meta charset=\"utf-8\">" + html.join("")};
  }

  /* ---------- clipboard ---------- */
  function copyToClipboard(md, html, cb){
    var nav = window.navigator;
    function legacy(){
      var ok = false;
      /* Pomocne pole MUSI zmizet i kdyz execCommand vyhodi vyjimku (nektere
         prohlizece pri zakazanem kopirovani hazi misto vraceni false).
         Jinak v strance zustane viset skryty focusnuty textarea s celym
         briefem - kradl by focus a s kazdym dalsim kliknutim by pribyval. */
      var ta = null;
      var focused = document.activeElement;
      try{
        ta = document.createElement("textarea");
        ta.value = md;
        ta.setAttribute("readonly", "readonly");
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.left = "-9999px";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        if(ta.setSelectionRange) ta.setSelectionRange(0, ta.value.length);
        ok = document.execCommand("copy");
      }catch(e){ ok = false; }
      try{
        if(ta && ta.parentNode) ta.parentNode.removeChild(ta);
        if(focused && focused.focus) focused.focus();
      }catch(e){}
      cb(!!ok);
    }
    function plain(){
      try{
        if(nav && nav.clipboard && typeof nav.clipboard.writeText === "function"){
          nav.clipboard.writeText(md).then(function(){ cb(true); }, legacy);
          return;
        }
      }catch(e){}
      legacy();
    }
    try{
      if(nav && nav.clipboard && typeof nav.clipboard.write === "function" &&
         typeof window.ClipboardItem === "function" && typeof window.Blob === "function"){
        var item = new window.ClipboardItem({
          "text/plain": new window.Blob([md], {type: "text/plain"}),
          "text/html": new window.Blob([html], {type: "text/html"})
        });
        nav.clipboard.write([item]).then(function(){ cb(true); }, plain);
        return;
      }
    }catch(e){}
    plain();
  }

  function flashCopy(btn, ok){
    var lbl = btn.firstChild;
    if(btn.__t){ clearTimeout(btn.__t); btn.__t = null; }
    btn.className = "btn btn--copy " + (ok ? "is-ok" : "is-err");
    lbl.textContent = ok ? "Zkopírováno ✓" : "Nelze zkopírovat";
    btn.__t = setTimeout(function(){
      btn.className = "btn btn--copy";
      lbl.textContent = COPY_LABEL;
      /* zamek sirky drzel jen po dobu zmeneneho popisku - jinak by tlacitko
         zustalo na sirce z portretu i po otoceni telefonu na sirku */
      btn.style.minWidth = "";
      btn.__t = null;
    }, ok ? 2000 : 2600);
  }

  function copyBtn(o){
    var b = el("button", "btn btn--copy");
    b.type = "button";
    var lbl = el("span", "lbl", COPY_LABEL);
    lbl.setAttribute("aria-live", "polite");
    b.appendChild(lbl);
    b.addEventListener("click", function(){
      /* sirku zamkneme jeste pred zmenou popisku, aby text nehnul rozlozenim */
      try{
        var w = b.getBoundingClientRect().width;
        if(w) b.style.minWidth = w.toFixed(2) + "px";
      }catch(e){}
      var brief = null;
      try{ brief = buildBrief(o); }
      catch(e){ flashCopy(b, false); return; }
      try{ copyToClipboard(brief.md, brief.html, function(ok){ flashCopy(b, ok); }); }
      catch(e){ flashCopy(b, false); }
    });
    return b;
  }

  function buildStatus(o){
    var wrap = el("div", "status");
    var current = statusMap[o.doc_id];
    for(var i = 0; i < STATUSES.length; i++){
      (function(s){
        var b = el("button", null, STATUS_LABEL[s]);
        b.type = "button";
        b.setAttribute("data-s", s);
        b.setAttribute("aria-pressed", current === s ? "true" : "false");
        b.addEventListener("click", function(){
          if(statusMap[o.doc_id] === s){ delete statusMap[o.doc_id]; }
          else { statusMap[o.doc_id] = s; }
          lsSet(LS_STATUS, statusMap);
          render();
        });
        wrap.appendChild(b);
      })(STATUSES[i]);
    }
    return wrap;
  }

  function buildCard(o, primary){
    var prio = priorityOf(o);
    var card = el("article", "card" + (primary ? " card--primary" : ""));
    var st = statusMap[o.doc_id];
    if(st) card.setAttribute("data-status", st);
    var docs = docsOf(o);

    var top = el("div", "card-top");
    var badges = el("div", "badges");
    var pp = el("span", "pill pill--prio", PRIO_LABEL[prio]);
    pp.setAttribute("data-p", prio);
    badges.appendChild(pp);
    if(isNew(o)) badges.appendChild(el("span", "pill pill--new", "nový"));
    if(o.classified_by === "heuristic"){
      var w = el("span", "pill pill--warn", "auto-klasifikace");
      w.title = "Klasifikováno bez jazykového modelu — ověřte údaje v PDF.";
      badges.appendChild(w);
    }
    if(hasProdej(docs)){
      var sp = el("span", "pill pill--warn", "prodej schválen");
      sp.title = PRODEJ_NOTE;
      badges.appendChild(sp);
    }
    if(st) badges.appendChild(el("span", "pill", STATUS_LABEL[st]));
    top.appendChild(badges);

    top.appendChild(el("h3", null, nonEmpty(o.dluznik_jmeno) ? o.dluznik_jmeno.trim() : "Dlužník neuveden"));

    var ref = el("div", "ref");
    var refBits = [];
    if(nonEmpty(o.spisova_znacka)) refBits.push(o.spisova_znacka.trim());
    if(nonEmpty(o.soud)) refBits.push(o.soud.trim());
    if(nonEmpty(o.ico)) refBits.push("IČO " + o.ico.trim());
    for(var i = 0; i < refBits.length; i++){
      if(i) ref.appendChild(el("span", "sep", "·"));
      ref.appendChild(document.createTextNode(refBits[i]));
    }
    if(refBits.length) top.appendChild(ref);

    var fact = el("div", "factline");
    var d = fmtDay(o.datum_podani);
    if(d) fact.appendChild(el("span", "date", d));
    if(nonEmpty(o.stav_rizeni)) fact.appendChild(el("span", "pill", o.stav_rizeni.trim()));
    if(primary && nonEmpty(o.sidlo)) fact.appendChild(el("span", null, o.sidlo.trim()));
    if(fact.childNodes.length) top.appendChild(fact);
    card.appendChild(top);

    if(nonEmpty(o.shrnuti)) card.appendChild(el("p", "summary", o.shrnuti.trim()));

    var assets = buildAssets(o, primary);
    if(assets) card.appendChild(assets);

    var docsBox = buildDocs(docs);
    if(docsBox) card.appendChild(docsBox);

    var admin = buildAdmin(o);
    if(admin) card.appendChild(admin);

    var btns = el("div", "btns");
    var b1 = linkBtn(o.doc_url, "PDF návrhu", true);
    /* Soupis je nejcennejsi listina veci a tlacitko je jedina cesta na nej
       na jedno klepnuti - seznam dokumentu nize je slozeny. Neschovavat ho
       proto ani tehdy, kdyz tentyz dokument je i v seznamu. */
    var b2 = soupisBtn(o);
    var b3 = linkBtn(o.detail_url, "Detail v ISIR", false);
    var b4 = linkBtn(o.or_url, "Obchodní rejstřík", false);
    if(b1) btns.appendChild(b1);
    if(b2) btns.appendChild(b2);
    if(b3) btns.appendChild(b3);
    if(b4) btns.appendChild(b4);
    btns.appendChild(copyBtn(o));
    card.appendChild(btns);

    var dossier = buildDossier(o);
    if(dossier) card.appendChild(dossier);

    card.appendChild(buildStatus(o));
    return card;
  }

  /* ---------- filtering ---------- */
  function haystack(o){
    if(o.__hay) return o.__hay;
    var parts = [o.dluznik_jmeno, o.spisova_znacka, o.soud, o.sidlo, o.shrnuti, o.ico, o.stav_rizeni];
    var list = Array.isArray(o.assets) ? o.assets : [];
    for(var i = 0; i < list.length; i++){
      var a = list[i] || {};
      parts.push(a.popis, a.kupujici, a.navrhovana_cena);
    }
    var s = (o.spravce && typeof o.spravce === "object") ? o.spravce : {};
    parts.push(s.jmeno, s.email);
    var clean = [];
    for(var k = 0; k < parts.length; k++){
      var v = txt(parts[k]).trim();
      if(v) clean.push(v);
    }
    o.__hay = deaccent(clean.join(" · "));
    return o.__hay;
  }

  function passes(o){
    var st = statusMap[o.doc_id];
    if(st === "archiv" && !filters.showArchive) return false;
    if(filters.prio !== "vse" && priorityOf(o) !== filters.prio) return false;
    if(filters.onlyNew && !isNew(o)) return false;
    var q = deaccent(filters.q).trim();
    if(q){
      var hay = haystack(o);
      var toks = q.split(/\s+/);
      for(var i = 0; i < toks.length; i++){
        if(toks[i] && hay.indexOf(toks[i]) === -1) return false;
      }
    }
    return true;
  }

  function plural(n){
    if(n === 1) return n + " nález";
    if(n >= 2 && n <= 4) return n + " nálezy";
    return n + " nálezů";
  }
  function archivedNote(n){
    if(n === 1) return "V archivu je skryta 1 položka.";
    if(n >= 2 && n <= 4) return "V archivu jsou skryty " + n + " položky.";
    return "V archivu je skryto " + n + " položek.";
  }

  function byDateDesc(a, b){
    var da = parseDay(a.datum_podani), db = parseDay(b.datum_podani);
    if(da && db) return db.getTime() - da.getTime();
    if(da) return -1;
    if(db) return 1;
    return 0;
  }
  function secondarySort(a, b){
    var pa = PRIO_ORDER[priorityOf(a)], pb = PRIO_ORDER[priorityOf(b)];
    if(pa !== pb) return pa - pb;
    return byDateDesc(a, b);
  }

  /* ---------- stats ---------- */
  function computeStats(){
    var s = (DATA && typeof DATA.stats === "object" && DATA.stats) ? DATA.stats : {};
    var c = {total:0, vysoka:0, stredni:0, nizka:0, new_7d:0};
    for(var i = 0; i < ITEMS.length; i++){
      c.total++;
      c[priorityOf(ITEMS[i])]++;
      if(isNew(ITEMS[i])) c.new_7d++;
    }
    function pick(k, fb){ return (typeof s[k] === "number" && isFinite(s[k])) ? s[k] : fb; }
    return {
      total: pick("total", c.total),
      vysoka: pick("vysoka", c.vysoka),
      stredni: pick("stredni", c.stredni),
      nizka: pick("nizka", c.nizka),
      new_7d: pick("new_7d", c.new_7d),
      cases: pick("cases", null)
    };
  }

  function renderStats(){
    var s = computeStats();
    clear(dom.stats);
    var tiles = [
      {k:"vse", n:s.total, l:"celkem"},
      {k:"vysoka", n:s.vysoka, l:"nemovité"},
      {k:"stredni", n:s.stredni, l:"movité"},
      {k:"nizka", n:s.nizka, l:"nehmotné"},
      {k:"new", n:s.new_7d, l:"nové (7 dní)"},
      {k:"cases", n:s.cases, l:"řízení"}
    ];
    for(var i = 0; i < tiles.length; i++){
      (function(t){
        if(t.n === null || t.n === undefined) return;
        var b = el("button", "stat");
        b.type = "button";
        b.setAttribute("data-k", t.k);
        b.appendChild(el("span", "n", t.n));
        b.appendChild(el("span", "l", t.l));
        if(t.k === "cases"){
          b.disabled = true;
        }else{
          var on = (t.k === "new") ? filters.onlyNew : (filters.prio === t.k);
          if(on) b.className = "stat on";
          b.addEventListener("click", function(){
            if(t.k === "new"){ filters.onlyNew = !filters.onlyNew; }
            else { filters.prio = (filters.prio === t.k) ? "vse" : t.k; }
            saveFilters();
            render();
          });
        }
        dom.stats.appendChild(b);
      })(tiles[i]);
    }
  }

  /* ---------- render ---------- */
  function syncControls(){
    dom.q.value = filters.q;
    dom.qClear.hidden = !filters.q;
    var chips = dom.chipsPrio.querySelectorAll(".chip");
    for(var i = 0; i < chips.length; i++){
      chips[i].setAttribute("aria-pressed", chips[i].getAttribute("data-p") === filters.prio ? "true" : "false");
    }
    dom.tNew.setAttribute("aria-pressed", filters.onlyNew ? "true" : "false");
    dom.tArch.setAttribute("aria-pressed", filters.showArchive ? "true" : "false");
  }

  function render(){
    renderStats();
    syncControls();
    clear(dom.gridPrimary);
    clear(dom.gridSecondary);
    clear(dom.filterEmpty);
    dom.filterEmpty.hidden = true;

    var primary = [], secondary = [];
    for(var i = 0; i < ITEMS.length; i++){
      var o = ITEMS[i];
      if(!passes(o)) continue;
      if(priorityOf(o) === "vysoka") primary.push(o); else secondary.push(o);
    }
    primary.sort(byDateDesc);
    secondary.sort(secondarySort);

    for(var a = 0; a < primary.length; a++) dom.gridPrimary.appendChild(buildCard(primary[a], true));
    for(var b = 0; b < secondary.length; b++) dom.gridSecondary.appendChild(buildCard(secondary[b], false));

    dom.secPrimary.hidden = primary.length === 0;
    dom.secSecondary.hidden = secondary.length === 0;
    dom.countPrimary.textContent = plural(primary.length);
    dom.countSecondary.textContent = plural(secondary.length);

    if(!primary.length && !secondary.length){
      var archived = 0;
      for(var k = 0; k < ITEMS.length; k++){ if(statusMap[ITEMS[k].doc_id] === "archiv") archived++; }
      var box;
      if(!ITEMS.length){
        box = notice("Zatím žádné nálezy", "Ve sledovaném období nebyl nalezen žádný návrh na zpeněžení mimo dražbu.");
      }else{
        box = notice("Nic neodpovídá filtru",
          "Zkuste vymazat hledaný text nebo přepnout prioritu na „Vše“.",
          archived && !filters.showArchive ? archivedNote(archived) : null);
      }
      dom.filterEmpty.appendChild(box);
      dom.filterEmpty.hidden = false;
    }
  }

  function renderHeader(){
    var bits = [];
    var stamp = fmtStamp(DATA && DATA.generated_at);
    bits.push(stamp ? ("aktualizováno " + stamp) : "čas aktualizace neznámý");
    var w = (DATA && typeof DATA.window === "object" && DATA.window) ? DATA.window : null;
    if(w){
      var from = fmtDay(w.from), to = fmtDay(w.to);
      if(from && to) bits.push("období " + from + " – " + to);
    }
    clear(dom.meta);
    for(var i = 0; i < bits.length; i++){
      if(i) dom.meta.appendChild(el("span", "sep", "·"));
      dom.meta.appendChild(document.createTextNode(bits[i]));
    }
    if(DATA && DATA.placeholder === true){
      clear(dom.banner);
      dom.banner.appendChild(el("b", null, "Ukázková data"));
      dom.banner.appendChild(document.createTextNode("Zobrazený obsah je vzorový, nikoli výsledek reálného sběru z ISIR."));
      dom.banner.hidden = false;
    }else{
      dom.banner.hidden = true;
    }
    clear(dom.foot);
    dom.foot.appendChild(document.createTextNode("Zdroj: Insolvenční rejstřík (ISIR), Ministerstvo spravedlnosti ČR — událost I_347, návrh na vydání souhlasu se zpeněžením majetkové podstaty mimo dražbu. Přehled je orientační, rozhodující je vždy obsah listiny ve spisu. Stavy položek se ukládají jen v tomto prohlížeči."));
  }

  /* ---------- events ---------- */
  var typeTimer = null;
  dom.q.addEventListener("input", function(){
    filters.q = dom.q.value || "";
    dom.qClear.hidden = !filters.q;
    if(typeTimer) clearTimeout(typeTimer);
    typeTimer = setTimeout(function(){ saveFilters(); render(); }, 110);
  });
  dom.qClear.addEventListener("click", function(){
    filters.q = "";
    dom.q.value = "";
    saveFilters();
    render();
    dom.q.focus();
  });
  dom.chipsPrio.addEventListener("click", function(ev){
    var t = ev.target;
    while(t && t !== dom.chipsPrio && !t.getAttribute) t = t.parentNode;
    if(!t || !t.getAttribute || !t.getAttribute("data-p")) return;
    filters.prio = t.getAttribute("data-p");
    saveFilters();
    render();
  });
  dom.tNew.addEventListener("click", function(){
    filters.onlyNew = !filters.onlyNew;
    saveFilters();
    render();
  });
  dom.tArch.addEventListener("click", function(){
    filters.showArchive = !filters.showArchive;
    saveFilters();
    render();
  });

  /* ---------- boot ---------- */
  function fail(title, body, detail){
    clear(dom.state);
    dom.state.appendChild(notice(title, body, detail));
    dom.secPrimary.hidden = true;
    dom.secSecondary.hidden = true;
    dom.meta.textContent = "data se nepodařilo načíst";
  }

  clear(dom.state);
  dom.state.appendChild(notice("Načítám data…", "Stahuji přehled příležitostí."));

  fetch("./data.json", {cache: "no-store"})
    .then(function(res){
      if(!res.ok) throw new Error("Server odpověděl " + res.status + " " + (res.statusText || ""));
      return res.text();
    })
    .then(function(body){
      var parsed;
      try{ parsed = JSON.parse(body); }
      catch(e){ throw new Error("Soubor data.json není platný JSON."); }
      DATA = (parsed && typeof parsed === "object") ? parsed : {};
      ITEMS = Array.isArray(DATA.opportunities) ? DATA.opportunities.filter(function(o){
        return o && typeof o === "object" && nonEmpty(o.doc_id);
      }) : [];
      clear(dom.state);
      renderHeader();
      render();
    })
    .catch(function(err){
      fail("Data se nepodařilo načíst",
           "Soubor data.json chybí nebo se nepodařilo stáhnout. Zkuste stránku načíst znovu, případně počkejte na ranní aktualizaci.",
           err && err.message ? String(err.message) : null);
    });
})();
</script>
</body>
</html>
